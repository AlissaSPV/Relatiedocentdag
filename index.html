<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛡️ SPV Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* SPV Web Guidelines palette
         Primary: #A0C51E / #729300
         Azure: #2BB6B7 | Forest: #004526
         Night blue: #161F31 / #1A2842 / #303C54
         Warm gray: #E2E1D3 / #EDEDE6 / #F2F2EE
         Signal: #E82F72 | Feedback: blue, green, orange and red palettes
      */
      @keyframes confetti-fall {
        0% {
          opacity: 0;
          transform: translate3d(0, -12vh, 0) rotate(0deg) scale(.7);
        }
        10% { opacity: 1; }
        70% { opacity: 1; }
        100% {
          opacity: 0;
          transform: translate3d(var(--drift), 115vh, 0) rotate(var(--rotation)) scale(1);
        }
      }

      @keyframes celebration-in {
        from { opacity: 0; transform: translate(-50%, -50%) scale(.6) rotate(-4deg); }
        60% { transform: translate(-50%, -50%) scale(1.08) rotate(2deg); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
      }

      @keyframes explosion-flash {
        0% { opacity: 0; }
        8% { opacity: 1; }
        28% { opacity: .35; }
        100% { opacity: 0; }
      }

      @keyframes explosion-core {
        0% { opacity: 0; transform: scale(.05) rotate(-20deg); filter: brightness(3); }
        18% { opacity: 1; transform: scale(1.35) rotate(8deg); filter: brightness(1.8); }
        42% { transform: scale(.95) rotate(-3deg); filter: brightness(1); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }

      @keyframes shockwave {
        from { opacity: .9; transform: scale(.1); }
        to { opacity: 0; transform: scale(4); }
      }

      @keyframes screen-shake {
        0%, 100% { transform: translate(0); }
        15% { transform: translate(-12px, 7px); }
        30% { transform: translate(10px, -8px); }
        45% { transform: translate(-7px, -5px); }
        60% { transform: translate(6px, 5px); }
        75% { transform: translate(-3px, 2px); }
      }

      @keyframes wrong-answer-pulse {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }

      @keyframes bomb-flame-flicker {
        from { transform: scale(.9, 1.08) rotate(-3deg); }
        to { transform: scale(1.08, .92) rotate(3deg); }
      }

      @keyframes bomb-spark {
        0% { opacity: 0; transform: translate(0, 2px) scale(.5); }
        25% { opacity: 1; }
        100% { opacity: 0; transform: translate(12px, -20px) scale(1); }
      }

      @keyframes encryption-bits {
        0%, 60%, 100% { content: "ENCRYPTION"; }
        62% { content: "0NCRYPTION"; }
        64% { content: "01CRYPTION"; }
        66% { content: "010RYPTION"; }
        68% { content: "0101YPTION"; }
        70% { content: "01010PTION"; }
        72% { content: "010101TION"; }
        74% { content: "0101010ION"; }
        76% { content: "01010101ON"; }
        78% { content: "010101010N"; }
        80% { content: "0101010101"; }
        82% { content: "E101010101"; }
        84% { content: "EN01010101"; }
        86% { content: "ENC1010101"; }
        88% { content: "ENCR010101"; }
        90% { content: "ENCRY10101"; }
        92% { content: "ENCRYP0101"; }
        94% { content: "ENCRYPT101"; }
        96% { content: "ENCRYPTI01"; }
        98% { content: "ENCRYPTIO1"; }
      }

      .confetti-piece {
        top: -1rem;
        animation: confetti-fall var(--duration) cubic-bezier(.2, .7, .2, 1) var(--delay) both;
      }

      .celebration-message { animation: celebration-in .55s cubic-bezier(.2, .9, .3, 1.3) both; }
      .explosion-overlay { animation: screen-shake .65s ease-out both; }
      .explosion-flash { animation: explosion-flash 1.2s ease-out both; }
      .explosion-core { animation: explosion-core .9s cubic-bezier(.15, .8, .25, 1.25) both; }
      .shockwave { animation: shockwave 1.25s ease-out both; }
      .shockwave-delayed { animation-delay: .18s; }
      .wrong-answer-pulse { animation: wrong-answer-pulse .45s ease-in-out 3; }
      .bomb-flame {
        animation: bomb-flame-flicker .38s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .bomb-spark {
        animation: bomb-spark .9s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .bomb-spark:nth-of-type(2) { animation-delay: .28s; }
      .bomb-spark:nth-of-type(3) { animation-delay: .56s; }

      .hack-panel {
        position: relative;
        overflow: hidden;
        border: 1px solid #E2E1D3;
        border-radius: 1.5rem;
        background: #FFFFFF;
        color: #161F31;
        box-shadow: 0 10px 30px rgba(22, 31, 49, .08);
      }

      .hack-panel::after {
        display: none;
      }

      .hack-title {
        color: #161F31;
        text-shadow: none;
      }

      .hack-title-text::before {
        content: "🔐 TOEGANGSCODE";
      }

      .hack-input {
        border: 2px solid #E2E1D3;
        border-radius: .75rem;
        background: #F2F2EE;
        color: #161F31;
        caret-color: #2BB6B7;
        font-family: inherit;
        letter-spacing: 0;
        text-shadow: none;
        box-shadow: none;
      }

      .hack-input::placeholder { color: #5B6477; }

      .hack-input:focus {
        border-color: #2BB6B7;
        outline: none;
        box-shadow: 0 0 0 3px rgba(43, 182, 183, .18);
      }

      .hack-input:disabled {
        border-color: #E2E1D3;
        background: #EDEDE6;
        color: #5B6477;
        text-shadow: none;
        box-shadow: none;
      }

      .hack-input.hack-input-confirmed,
      .hack-input.hack-input-confirmed:disabled {
        border-color: #5F9605;
        background: #F7FDED;
        color: #3D5F06;
        font-weight: 900;
        box-shadow: 0 0 0 3px rgba(95, 150, 5, .10);
        opacity: 1;
      }

      .assessment-answer {
        border: 1px solid #E2E1D3;
        border-radius: .75rem;
        background: #FFFFFF;
        color: #161F31;
        caret-color: #2BB6B7;
        box-shadow: none;
      }

      .assessment-answer::placeholder { color: #5B6477; }

      .assessment-answer:focus {
        border-color: #2BB6B7;
        outline: none;
        box-shadow: 0 0 0 3px rgba(43, 182, 183, .16);
      }

      .assessment-answer:disabled {
        border-color: #E2E1D3;
        background: #EDEDE6;
        color: #5B6477;
      }


      .answer-wire {
        --swipe-x: 0px;
        position: relative;
        isolation: isolate;
        min-height: 4.25rem;
        overflow: hidden;
        border: 0;
        border-radius: 1rem;
        background: #FFFFFF;
        touch-action: pan-y;
        user-select: none;
        transform: translateX(var(--swipe-x));
        transition: transform .16s ease, opacity .16s ease;
      }

      .answer-wire::before {
        position: absolute;
        left: .8rem;
        right: .8rem;
        top: 50%;
        z-index: -1;
        height: .62rem;
        border-radius: 999px;
        background: var(--wire-color);
        box-shadow:
          0 2px 0 rgba(22, 31, 49, .14),
          inset 0 2px 2px rgba(255, 255, 255, .28),
          inset 0 -2px 2px rgba(22, 31, 49, .18);
        content: "";
        transform: translateY(-50%);
      }

      .answer-wire:not(:disabled):hover .answer-wire-label,
      .answer-wire:not(:disabled):focus-visible .answer-wire-label {
        transform: scale(1.015);
      }

      .answer-wire:disabled {
        cursor: not-allowed;
        opacity: .58;
      }

      .answer-wire-label {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 3.3rem;
        width: calc(100% - 4.5rem);
        margin: .45rem auto;
        align-items: center;
        justify-content: space-between;
        gap: .75rem;
        border: 2px solid var(--wire-color);
        border-radius: .85rem;
        background: rgba(255, 255, 255, .96);
        padding: .7rem .9rem;
        color: #161F31;
        text-align: left;
        transition: transform .16s ease;
      }

      .answer-wire-color-dot {
        width: .9rem;
        height: .9rem;
        flex: 0 0 auto;
        border: 2px solid rgba(255, 255, 255, .95);
        border-radius: 999px;
        background: var(--wire-color);
        box-shadow: 0 0 0 1px rgba(22, 31, 49, .16);
      }

      .answer-wire-cut {
        pointer-events: none;
        opacity: 0;
        transform: translateX(var(--cut-direction, 120px)) rotate(1deg);
      }

      .wire-instruction {
        border: 1px dashed #2BB6B7;
        border-radius: .85rem;
        background: rgba(43, 182, 183, .08);
      }

      .hack-status {
        border-radius: .75rem;
        letter-spacing: 0;
      }

      .hack-status-success {
        border: 1px solid #96D334;
        background: #F7FDED;
        color: #3D5F06;
        box-shadow: none;
      }

      .hack-status-error {
        border: 1px solid #E91A47;
        background: #FFF0F1;
        color: #9F1239;
        box-shadow: none;
      }


      .bomb-clock-label {
        font-family: "Share Tech Mono", Consolas, monospace;
        letter-spacing: .18em;
        text-shadow: 0 0 8px rgba(233, 26, 71, .28);
      }

      .bomb-clock-time {
        font-family: "Share Tech Mono", Consolas, monospace;
        letter-spacing: .08em;
        text-shadow: 0 0 10px rgba(251, 113, 133, .3);
      }

      .spv-map {
        height: min(62vh, 560px);
        min-height: 380px;
        background: #EDEDE6;
      }

      .spv-map .leaflet-control-zoom a {
        color: #1A2842;
      }

      .spv-map .leaflet-control-attribution {
        color: #5B6477;
        font-size: 10px;
      }

      .spv-gps-icon {
        position: relative;
        width: 28px;
        height: 28px;
      }

      .spv-gps-dot {
        position: absolute;
        left: 8px;
        top: 8px;
        width: 12px;
        height: 12px;
        border: 3px solid #FFFFFF;
        border-radius: 999px;
        background: #2BB6B7;
        box-shadow: 0 1px 5px rgba(22, 31, 49, .35);
      }

      .spv-gps-pulse {
        position: absolute;
        inset: 2px;
        border: 2px solid rgba(43, 182, 183, .55);
        border-radius: 999px;
        animation: gps-pulse 1.8s ease-out infinite;
      }

      @keyframes gps-pulse {
        0% { opacity: .9; transform: scale(.45); }
        75%, 100% { opacity: 0; transform: scale(1.2); }
      }

      @media (max-width: 640px) {
        .spv-map {
          height: 52vh;
          min-height: 320px;
        }
      }



      /* Grotere iconen en leesbaardere bediening, met extra schaal op mobiel */
      .ui-emoji {
        display: inline-block;
        margin-right: .14em;
        font-size: 1.22em;
        line-height: 1;
        vertical-align: -.08em;
      }

      @media (max-width: 639px) {
        .ui-emoji {
          margin-right: .2em;
          font-size: 1.42em;
        }

        button {
          min-height: 3.25rem;
        }

        textarea,
        input,
        button {
          font-size: 1rem;
        }

        .leaflet-control,
        .leaflet-popup-content {
          font-size: .95rem;
        }
      }


      @keyframes score-overlay-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes score-panel-in {
        from { opacity: 0; transform: translateY(22px) scale(.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes score-scan {
        0% { transform: translateY(-130%); opacity: 0; }
        15% { opacity: .55; }
        100% { transform: translateY(520%); opacity: 0; }
      }

      @keyframes score-pulse {
        0%, 100% { opacity: .55; transform: scale(.98); }
        50% { opacity: 1; transform: scale(1); }
      }

      @keyframes score-number-pop {
        0% { transform: scale(.92); }
        70% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      .score-overlay {
        animation: score-overlay-in .25s ease-out both;
      }

      .score-panel {
        position: relative;
        overflow: hidden;
        animation: score-panel-in .45s cubic-bezier(.2, .8, .2, 1) both;
      }

      .score-scanline {
        position: absolute;
        inset: 0 0 auto;
        height: 22%;
        pointer-events: none;
        background: linear-gradient(to bottom, transparent, rgba(43, 182, 183, .14), transparent);
        animation: score-scan 2.2s linear infinite;
      }

      .score-calculating {
        animation: score-pulse 1.1s ease-in-out infinite;
      }

      .score-final-number {
        font-family: "Share Tech Mono", Consolas, monospace;
        animation: score-number-pop .5s ease-out both;
      }

      .score-step {
        transition: border-color .25s ease, background-color .25s ease, opacity .25s ease, transform .25s ease;
      }

      .score-step-pending {
        opacity: .52;
        transform: translateY(2px);
      }

      .score-step-done {
        opacity: 1;
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .confetti-piece,
        .celebration-message,
        .explosion-overlay,
        .explosion-flash,
        .explosion-core,
        .shockwave,
        .wrong-answer-pulse,
        .bomb-flame,
        .bomb-spark,
        .score-overlay,
        .score-panel,
        .score-scanline,
        .score-calculating,
        .score-final-number {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body class="min-h-screen bg-[#F2F2EE] text-[#161F31] antialiased">
    <div id="app">
      <section
        v-if="!gameStarted"
        class="flex min-h-screen items-center justify-center px-6 py-12"
      >
        <div class="w-full max-w-xl rounded-3xl border border-[#E2E1D3] bg-white p-10 text-center shadow-xl sm:p-14">
          <p class="text-base font-bold uppercase tracking-[0.25em] text-[#004526]">
            <span class="ui-emoji" aria-hidden="true">🛡️</span> SPV Challenge
          </p>
          <h1 class="mt-4 text-4xl font-black tracking-tight text-[#161F31] sm:text-5xl">
            <span class="ui-emoji" aria-hidden="true">🔐</span> Kraak de toegangscode
          </h1>
          <p class="mx-auto mt-5 max-w-md leading-7 text-[#5B6477]">
            <span class="ui-emoji" aria-hidden="true">🎯</span> Voltooi de assessments, verzamel de letters en ontdek het verborgen woord.
          </p>
          <button
            type="button"
            class="mt-8 w-full rounded-xl bg-[#A0C51E] px-6 py-4 text-xl font-bold text-[#161F31] shadow-sm transition hover:bg-[#729300] focus:outline-none focus:ring-2 focus:ring-[#2BB6B7] focus:ring-offset-2"
            @click="startGame"
          >
            <span class="ui-emoji" aria-hidden="true">▶️</span> Spelen
          </button>
        </div>
      </section>

      <template v-else>
      <div
        v-if="explosionVisible"
        class="explosion-overlay pointer-events-none fixed inset-0 z-[110] flex items-center justify-center overflow-hidden bg-[#4C0519]/80"
        role="alert"
        aria-live="assertive"
      >
        <div class="explosion-flash absolute inset-0 bg-[#FED7AA]"></div>
        <div class="shockwave absolute h-52 w-52 rounded-full border-[18px] border-[#FB923C]"></div>
        <div class="shockwave shockwave-delayed absolute h-52 w-52 rounded-full border-[10px] border-[#FED7AA]"></div>
        <div class="explosion-core relative text-center text-white">
          <p class="text-9xl drop-shadow-[0_0_35px_rgba(251,146,60,1)]" aria-hidden="true">💥</p>
          <p class="mt-5 text-4xl font-black uppercase tracking-tight">De bom is ontploft!</p>
          <p v-if="explodedAssessmentTitle" class="mt-2 text-xl font-semibold text-[#FECDD3]">
            {{ explodedAssessmentTitle }}
          </p>
        </div>
      </div>

      <div
        v-if="wrongAnswerPulse"
        class="wrong-answer-pulse pointer-events-none fixed inset-0 z-[90] border-[12px] border-[#E91A47] bg-[#E91A47]/30"
        aria-hidden="true"
      ></div>

      <div
        v-if="confettiVisible"
        class="pointer-events-none fixed inset-0 z-[100] overflow-hidden bg-[#161F31]/30"
        role="status"
        aria-live="assertive"
      >
        <span
          v-for="piece in confettiPieces"
          :key="piece.id"
          class="confetti-piece absolute h-3 w-3 rounded-sm shadow-sm"
          :class="piece.color"
          :style="{
            left: piece.left,
            '--drift': piece.drift,
            '--rotation': piece.rotation,
            '--duration': piece.duration,
            '--delay': piece.delay,
          }"
        ></span>
        <div class="celebration-message absolute left-1/2 top-1/2 rounded-3xl bg-white px-10 py-8 text-center shadow-2xl">
          <p class="text-6xl" aria-hidden="true">🎉</p>
          <p class="mt-3 text-3xl font-black uppercase tracking-tight text-[#5F9605]">
            Bom ontmanteld
          </p>
        </div>
      </div>

      <div
        v-if="scoreScreenVisible"
        class="score-overlay fixed inset-0 z-[120] flex items-center justify-center overflow-y-auto bg-[#161F31]/90 px-4 py-8"
        role="dialog"
        aria-modal="true"
        aria-labelledby="score-title"
      >
        <section class="score-panel w-full max-w-xl rounded-3xl border border-[#2BB6B7]/50 bg-white p-5 shadow-2xl sm:p-8">
          <div class="score-scanline" aria-hidden="true"></div>

          <div class="relative">
            <p class="text-center text-sm font-black uppercase tracking-[0.22em] text-[#5F9605]">
              <span class="ui-emoji" aria-hidden="true">🔓</span> Toegang verleend
            </p>
            <h2 id="score-title" class="mt-2 text-center text-2xl font-black tracking-tight text-[#161F31] sm:text-3xl">
              {{ scoreAnimationDone ? 'Score berekend' : 'Score wordt berekend...' }}
            </h2>
            <div class="mt-6 space-y-2.5" aria-live="polite">
              <div
                class="score-step flex items-center justify-between rounded-xl border px-4 py-3"
                :class="scoreStage >= 1 ? 'score-step-done border-[#96D334] bg-[#F7FDED]' : 'score-step-pending border-[#E2E1D3] bg-[#F2F2EE]'"
              >
                <span class="font-semibold"><span class="ui-emoji" aria-hidden="true">✅</span> Opgeloste opdrachten</span>
                <span class="font-mono font-black">{{ scoreStage >= 1 ? scoreBreakdown.solved + ' × 500 · +' + scoreBreakdown.baseXp.toLocaleString('nl-NL') + ' XP' : '...' }}</span>
              </div>

              <div
                class="score-step flex items-center justify-between rounded-xl border px-4 py-3"
                :class="scoreStage >= 2 ? 'score-step-done border-[#FB923C] bg-[#FFF4E5]' : 'score-step-pending border-[#E2E1D3] bg-[#F2F2EE]'"
              >
                <span class="font-semibold"><span class="ui-emoji" aria-hidden="true">⏱️</span> Tijdstraf</span>
                <span class="font-mono font-black">{{ scoreStage >= 2 ? scoreBreakdown.halfHourBlocks + ' × 30 min · -' + scoreBreakdown.timePenalty.toLocaleString('nl-NL') + ' XP' : '...' }}</span>
              </div>

              <div
                class="score-step flex items-center justify-between rounded-xl border px-4 py-3"
                :class="scoreStage >= 3 ? 'score-step-done border-[#E91A47] bg-[#FFF0F1]' : 'score-step-pending border-[#E2E1D3] bg-[#F2F2EE]'"
              >
                <span class="font-semibold"><span class="ui-emoji" aria-hidden="true">⚠️</span> Foute toegangscodes</span>
                <span class="font-mono font-black">{{ scoreStage >= 3 ? scoreBreakdown.wrongAttempts + ' × 100 · -' + scoreBreakdown.wrongPenalty.toLocaleString('nl-NL') + ' XP' : '...' }}</span>
              </div>

            </div>

            <div class="mt-6 rounded-2xl bg-[#161F31] px-5 py-5 text-center text-white">
              <p class="text-sm font-bold uppercase tracking-[0.18em] text-[#2BB6B7]">Eind-XP</p>
              <p class="score-final-number mt-1 text-5xl font-black tabular-nums text-[#A0C51E] sm:text-6xl">
                {{ animatedScore.toLocaleString('nl-NL') }} XP
              </p>
            </div>

            <p v-if="!scoreAnimationDone" class="score-calculating mt-4 text-center text-sm font-semibold text-[#5B6477]">
              Resultaten worden verwerkt...
            </p>

            <button
              v-else
              type="button"
              class="mt-5 w-full rounded-xl bg-[#A0C51E] px-5 py-3 text-lg font-bold text-[#161F31] transition hover:bg-[#729300] focus:outline-none focus:ring-2 focus:ring-[#2BB6B7] focus:ring-offset-2"
              @click="closeScoreScreen"
            >
              <span class="ui-emoji" aria-hidden="true">🏁</span> Verder
            </button>
          </div>
        </section>
      </div>

      <main class="mx-auto grid min-h-screen w-full max-w-7xl content-start gap-6 px-4 py-5 sm:px-6 sm:py-8 lg:px-8">
        <section aria-label="TOEGANGSCODE" class="hack-panel px-4 py-6 sm:px-7 sm:py-8">
          <p
            class="hack-title mb-5 text-center text-xl font-bold tracking-tight sm:text-2xl"
            aria-label="TOEGANGSCODE"
          >
            <span class="hack-title-text inline-block" aria-hidden="true"></span>
          </p>
          <div class="mx-auto grid w-full max-w-2xl grid-cols-10 gap-1 sm:gap-3">
            <label
              v-for="(char, index) in chars"
              :key="index"
              class="flex min-w-0 flex-col items-center gap-1.5"
            >
              <span class="sr-only">Letter {{ index + 1 }}</span>
              <input
                :value="studentAnswers[index]"
                type="text"
                maxlength="1"
                autocomplete="off"
                :disabled="gameState.hasPunishment"
                :readonly="isLetterVisible(index)"
                class="hack-input h-11 w-full min-w-0 p-0 text-center text-xl font-bold uppercase transition disabled:cursor-not-allowed disabled:opacity-60 sm:h-12 sm:text-xl"

          function normalizeAnswer(answer) {

          function wireSwipeKey(assessmentId, optionId) {
            return `${assessmentId}:${optionId}`;
          }

          function resetWireTransform(element) {
            if (!element) return;
            element.style.setProperty('--swipe-x', '0px');
          }

          function startWireSwipe(assessmentId, optionId, event) {
            if (assessmentWireLocked.value[assessmentId]) return;

            const key = wireSwipeKey(assessmentId, optionId);
            wireSwipeStarts.set(key, {
              startX: event.clientX,
              element: event.currentTarget,
              pointerId: event.pointerId,
            });

            event.currentTarget?.setPointerCapture?.(event.pointerId);
          }

          function moveWireSwipe(assessmentId, optionId, event) {
            const key = wireSwipeKey(assessmentId, optionId);
            const swipe = wireSwipeStarts.get(key);
            if (!swipe) return;

            const deltaX = Math.max(-110, Math.min(110, event.clientX - swipe.startX));
            swipe.element?.style.setProperty('--swipe-x', `${deltaX}px`);
          }

          function cancelWireSwipe(assessmentId, optionId, event) {
            const key = wireSwipeKey(assessmentId, optionId);
            const swipe = wireSwipeStarts.get(key);
            resetWireTransform(swipe?.element);
            wireSwipeStarts.delete(key);
            event?.currentTarget?.releasePointerCapture?.(event.pointerId);
          }

          function finishWireSwipe(assessment, option, event) {
            const key = wireSwipeKey(assessment.id, option.id);
            const swipe = wireSwipeStarts.get(key);
            if (!swipe) return;

            const deltaX = event.clientX - swipe.startX;
            wireSwipeStarts.delete(key);
            event.currentTarget?.releasePointerCapture?.(event.pointerId);

            if (Math.abs(deltaX) < 64) {
              resetWireTransform(swipe.element);
              return;
            }

            cutWireDirection.value = deltaX < 0 ? -180 : 180;
            cutAssessmentWire(assessment, option);

          function calculateScoreBreakdown() {

            return {
              elapsedSeconds,
              solved,

              halfHourBlocks: elapsedHalfHours,

              animatedScore.value = Math.round(targetScore * eased);

              if (progress < 1) {

              animatedScore.value = targetScore;

          function fuseDashArray(assessment) {

          }

          function cubicCoordinate(t, start, controlOne, controlTwo, end) {
            const inverse = 1 - t;
            return inverse ** 3 * start
              + 3 * inverse ** 2 * t * controlOne
              + 3 * inverse * t ** 2 * controlTwo
              + t ** 3 * end;
          }

          function fuseTipTransform(assessment) {
            const progress = fuseProgress(assessment);
            const firstHalf = progress <= .5;
            const t = firstHalf ? progress * 2 : (progress - .5) * 2;
            const x = firstHalf
              ? cubicCoordinate(t, 408, 420, 505, 590)
              : cubicCoordinate(t, 590, 680, 720, 675);
            const y = firstHalf
              ? cubicCoordinate(t, 230, 118, 68, 88)
              : cubicCoordinate(t, 88, 109, 190, 285);

            return `translate(${x.toFixed(1)} ${y.toFixed(1)})`;
          }

            const timePlayed = gameState.value.timePlayed;

            if (!gameState.value.hasAnswer) {

            if (

            ) {
              gameState.value.punishmentTime -= 1;

              if (gameState.value.punishmentTime === 0) {
                gameState.value.hasPunishment = false;
              }
            }

            Object.keys(assessmentTimers.value).forEach((assessmentId) => {
              const assessment = assesmentData.value.find(
                (item) => String(item.id) === String(assessmentId),
              );

              if (
                assessmentTimers.value[assessmentId] > 0 &&
                !assessment?.state.isDismanteld
              ) {
                assessmentTimers.value[assessmentId] -= 1;
              }

              if (assessmentTimers.value[assessmentId] === 0) {
                if (assessment) {
                  assessment.state.timeLeft = false;

                  if (!assessment.state.isDismanteld) {
                    triggerExplosion(assessment);
                  }
                }
              }
            });

            syncClockSound();
          }

          function initMap() {
            if (leafletMap) return true;

            const mapElement = document.getElementById('spv-map');
            if (!mapElement) return false;

            if (!window.L) {
              mapMessage.value = 'De kaartbibliotheek kon niet worden geladen. Controleer de internetverbinding.';
              return false;
            }

            leafletMap = window.L.map(mapElement, {
              zoomControl: true,
              attributionControl: true,
            }).setView(ELSPETERWEG_CENTER, 14);

            window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; OpenStreetMap-bijdragers',
            }).addTo(leafletMap);

            mapMessage.value = '';
            window.setTimeout(() => leafletMap?.invalidateSize(), 0);
            return true;
          }

          function toggleGpsTracking() {
            if (gpsTracking.value) {
              stopGpsTracking();
              return;
            }

            startGpsTracking();
          }

          function startGpsTracking() {
            if (!navigator.geolocation) {
              mapMessage.value = 'Live GPS wordt niet ondersteund door deze browser.';
              gpsStatus.value = 'GPS niet beschikbaar';
              return;
            }

            if (!initMap()) return;

            gpsTracking.value = true;
            gpsStatus.value = 'GPS wordt gezocht...';
            mapMessage.value = 'Sta locatietoegang toe om je positie live op de kaart te volgen.';

            gpsWatchId = navigator.geolocation.watchPosition(
              updateGpsPosition,
              handleGpsError,
              {
                enableHighAccuracy: true,
                maximumAge: 2000,
                timeout: 15000,
              },
            );
          }

          function stopGpsTracking() {
            if (gpsWatchId !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(gpsWatchId);
            }

            gpsWatchId = null;
            gpsTracking.value = false;
            gpsStatus.value = 'GPS uit';
            mapMessage.value = '';
          }

          function updateGpsPosition(position) {
            if (!leafletMap || !window.L) return;

            const { latitude, longitude, accuracy } = position.coords;
            const location = [latitude, longitude];
            const roundedAccuracy = Math.max(1, Math.round(accuracy || 0));

            const gpsIcon = window.L.divIcon({
              className: '',
              html: '<div class="spv-gps-icon"><span class="spv-gps-pulse"></span><span class="spv-gps-dot"></span></div>',
              iconSize: [28, 28],
              iconAnchor: [14, 14],
            });

            if (!gpsMarker) {
              gpsMarker = window.L.marker(location, { icon: gpsIcon, zIndexOffset: 1000 }).addTo(leafletMap);
              gpsMarker.bindTooltip('Jouw live locatie', { direction: 'top', offset: [0, -10] });
            } else {
              gpsMarker.setLatLng(location);
            }

            if (!gpsAccuracyCircle) {
              gpsAccuracyCircle = window.L.circle(location, {
                radius: roundedAccuracy,
                color: '#2BB6B7',
                fillColor: '#2BB6B7',
                fillOpacity: .12,
                weight: 1,
              }).addTo(leafletMap);
            } else {
              gpsAccuracyCircle.setLatLng(location);
              gpsAccuracyCircle.setRadius(roundedAccuracy);
            }

            gpsStatus.value = `GPS actief · nauwkeurigheid ±${roundedAccuracy} m`;
            mapMessage.value = '';

            if (gpsTracking.value) {
              leafletMap.setView(location, Math.max(leafletMap.getZoom(), 17), { animate: true });
            }
          }

          function handleGpsError(error) {
            const messages = {
              1: 'Locatietoegang is geweigerd. Geef deze site toestemming om je locatie te gebruiken.',
              2: 'Je GPS-locatie kon niet worden bepaald.',
              3: 'Het ophalen van je GPS-locatie duurde te lang.',
            };

            mapMessage.value = messages[error.code] || 'Er is een fout opgetreden bij het ophalen van je GPS-locatie.';
            gpsStatus.value = 'GPS fout';

            if (error.code === 1) {
              stopGpsTracking();
              gpsStatus.value = 'GPS geblokkeerd';
              mapMessage.value = messages[1];
            }
          }

          function parseGpxPoint(element) {
            const lat = Number.parseFloat(element.getAttribute('lat'));
            const lon = Number.parseFloat(element.getAttribute('lon'));
            return Number.isFinite(lat) && Number.isFinite(lon) ? [lat, lon] : null;
          }

          function clearGpx() {
            if (gpxLayer && leafletMap) {
              leafletMap.removeLayer(gpxLayer);
            }

            gpxLayer = null;
            gpxName.value = '';
            gpxPointCount.value = 0;
          }

          function renderGpxSource(source, displayName = 'route.gpx') {
            if (!initMap()) return;

            const xml = new DOMParser().parseFromString(source, 'application/xml');

            if (xml.getElementsByTagName('parsererror').length) {
              throw new Error('Ongeldig GPX-bestand');
            }

            clearGpx();
            gpxLayer = window.L.featureGroup().addTo(leafletMap);

            let pointCount = 0;
            let layerCount = 0;
            const trackSegments = Array.from(xml.getElementsByTagName('trkseg'));

            trackSegments.forEach((segment) => {
              const points = Array.from(segment.getElementsByTagName('trkpt'))
                .map(parseGpxPoint)
                .filter(Boolean);

              pointCount += points.length;

              if (points.length >= 2) {
                window.L.polyline(points, {
                  color: '#E82F72',
                  weight: 5,
                  opacity: .9,
                  lineJoin: 'round',
                }).addTo(gpxLayer);
                layerCount += 1;
              } else if (points.length === 1) {
                window.L.circleMarker(points[0], {
                  radius: 5,
                  color: '#E82F72',
                  fillColor: '#E82F72',
                  fillOpacity: 1,
                }).addTo(gpxLayer);
                layerCount += 1;
              }
            });

            const routes = Array.from(xml.getElementsByTagName('rte'));
            routes.forEach((route) => {
              const points = Array.from(route.getElementsByTagName('rtept'))
                .map(parseGpxPoint)
                .filter(Boolean);

              pointCount += points.length;

              if (points.length >= 2) {
                window.L.polyline(points, {
                  color: '#E82F72',
                  weight: 5,
                  opacity: .9,
                  dashArray: '10 8',
                }).addTo(gpxLayer);
                layerCount += 1;
              } else if (points.length === 1) {
                window.L.circleMarker(points[0], {
                  radius: 5,
                  color: '#E82F72',
                  fillColor: '#E82F72',
                  fillOpacity: 1,
                }).addTo(gpxLayer);
                layerCount += 1;
              }
            });

            const waypoints = Array.from(xml.getElementsByTagName('wpt'));
            waypoints.forEach((waypoint) => {
              const point = parseGpxPoint(waypoint);
              if (!point) return;

              pointCount += 1;
              const nameElement = waypoint.getElementsByTagName('name')[0];
              const label = nameElement?.textContent?.trim() || 'GPX-punt';

              window.L.circleMarker(point, {
                radius: 6,
                color: '#1A2842',
                fillColor: '#A0C51E',
                fillOpacity: 1,
                weight: 2,
              }).bindTooltip(label).addTo(gpxLayer);
              layerCount += 1;
            });

            if (layerCount === 0) {
              clearGpx();
              throw new Error('Geen bruikbare track-, route- of waypointgegevens gevonden');
            }

            gpxName.value = displayName;
            gpxPointCount.value = pointCount;
            mapMessage.value = '';

            const bounds = gpxLayer.getBounds();
            if (bounds.isValid()) {
              leafletMap.fitBounds(bounds.pad(.12), { maxZoom: 17 });
            }
          }

          async function loadDefaultGpx() {
            if (defaultGpxLoadStarted) return;
            if (!initMap()) return;

            defaultGpxLoadStarted = true;
            mapMessage.value = 'Standaardroute wordt geladen...';

            try {
              const response = await fetch(DEFAULT_GPX_URL, { cache: 'no-store' });
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }

              const source = await response.text();
              const displayName = DEFAULT_GPX_URL.split('/').pop() || 'route.gpx';
              renderGpxSource(source, displayName);
            } catch (error) {
              clearGpx();
              mapMessage.value = `Standaard GPX kon niet worden geladen uit ${DEFAULT_GPX_URL}. Plaats de route als gpx/route.gpx en open de app via een webserver.`;
              console.warn('Standaard GPX laden mislukt.', error);
            }
          }

          watch(currentXp, (newXp, oldXp) => {
            if (oldXp === undefined || newXp === oldXp || !audioUnlocked) return;
            window.setTimeout(() => playSound('xp'), newXp < oldXp ? 160 : 80);
          });

          watch(activeTab, (tab) => {
            if (tab !== 'kaart') return;

            window.setTimeout(() => {
              if (initMap()) {
                leafletMap.invalidateSize();
                loadDefaultGpx();
              }
            }, 50);
          });

          watch(
            [gameStarted, activeTab, gameState, studentAnswers, assessmentCompletion, assessmentTimers, assessmentAnswers, defusedAssessmentIds, explodedAssessmentIds, assesmentData],
            saveGameState,
            { deep: true },
          );

          onMounted(() => {
            restoreGameState();
            window.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });
            window.addEventListener('keydown', unlockAudio, { once: true });
            window.setTimeout(() => {
              if (initMap()) {
                loadDefaultGpx();
              }
              if (activeTab.value === 'kaart') {
                leafletMap?.invalidateSize();
              }
            }, 0);
          });

          onUnmounted(() => {
            clearScoreAnimation();
            Object.values(sounds).forEach((audio) => {
              audio.pause();
              try { audio.currentTime = 0; } catch (_) {}
            });

            if (gameTimer !== null) {
              window.clearInterval(gameTimer);
            }

            if (gpsWatchId !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(gpsWatchId);
            }

            if (leafletMap) {
              leafletMap.remove();
              leafletMap = null;
            }
          });


          function isLetterVisible(charIndex) {
            const assessmentId = Object.keys(assessmentCharIndexes.value).find(
              (id) => assessmentCharIndexes.value[id] === charIndex,
            );

            return assessmentId
              ? assessmentCompletion.value[assessmentId] === true
              : false;
          }

          function isCardFlipped(id) {
            return flippedCardIds.value.includes(id);
          }

          function startAssessmentTimer(assessment) {
            unlockAudio();
            if (assessmentTimers.value[assessment.id] === undefined) {
              assessmentTimers.value[assessment.id] = assessment.timing.durationMinutes * 60;
            }
            syncClockSound();
          }

          function turnCard(assessment) {
            const id = assessment.id;

            if (isCardFlipped(id)) {
              flippedCardIds.value = flippedCardIds.value.filter((cardId) => cardId !== id);
              return;
            }

            startAssessmentTimer(assessment);
            flippedCardIds.value = [...flippedCardIds.value, id];
          }

          return {
            assesmentData,
            activeTab,
            gpsTracking,
            gpsStatus,
            mapMessage,
            gpxName,
            gpxPointCount,
            toggleGpsTracking,
            chars,
            assessmentCharIndexes,
            assessmentCompletion,
            studentAnswers,
            codeCracked,
            codeIncorrect,
            flippedCardIds,
            assessmentTimers,
            assessmentAnswers,
            assessmentWireLocked,
            cutWireKey,
            cutWireDirection,
            defusedAssessmentIds,
            confettiVisible,
            wrongAnswerPulse,
            explosionVisible,
            explodedAssessmentTitle,
            explodedAssessmentIds,
            confettiPieces,
            gameStarted,
            gameState,
            currentXp,
            scoreBreakdown,
            scoreScreenVisible,
            scoreStage,
            scoreAnimationDone,
            animatedScore,
            startScoreCalculation,
            closeScoreScreen,
            startGame,
            saveGameState,
            restoreGameState,
            completeAssessmentInTime,
            normalizeAnswer,
            updateAssessmentAnswer,
            submitAssessmentAnswer,
            startWireSwipe,
            moveWireSwipe,
            finishWireSwipe,
            cancelWireSwipe,
            cutAssessmentWire,
            showConfetti,
            triggerWrongAnswerPulse,
            triggerExplosion,
            handleLetterInput,
            checkCode,
            registerWrongInput,
            formatPunishmentTime,
            formatTimePlayed,
            formatAssessmentTime,
            fuseDashArray,
            fuseTipTransform,
            updateGameTimer,
            isLetterVisible,
            isCardFlipped,
            startAssessmentTimer,
            turnCard,
          };
        },
      }).mount('#app');
    </script>
  </body>
</html>
